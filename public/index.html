<body class="bg-zinc-100 dark:bg-zinc-950 text-zinc-900 dark:text-zinc-100 min-h-screen transition-colors duration-200">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // --- Service Worker Registration ---
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW registration error', err));
      });
    }

    // --- Canvas Image Compression Helper (500px max, webp, 0.6 quality) ---
    function compressImageToWebP(file) {
      return new Promise((resolve, reject) => {
        if (!file || !file.type.startsWith('image/')) {
          return reject(new Error('Invalid image file'));
        }
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            const maxDim = 500;
            let width = img.width;
            let height = img.height;
            if (width > maxDim || height > maxDim) {
              if (width > height) {
                height = Math.round((height * maxDim) / width);
                width = maxDim;
              } else {
                width = Math.round((width * maxDim) / height);
                height = maxDim;
              }
            }
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            // Compress to webp at 0.6 quality
            let result = canvas.toDataURL('image/webp', 0.6);
            if (!result.startsWith('data:image/webp')) {
              // fallback if browser lacks canvas webp write support
              result = canvas.toDataURL('image/jpeg', 0.6);
            }
            resolve(result);
          };
          img.onerror = () => reject(new Error('Failed to load image'));
          img.src = event.target.result;
        };
        reader.onerror = () => reject(new Error('Failed to read file'));
        reader.readAsDataURL(file);
      });
    }

    // --- IndexedDB Database Manager using idb ---
    const DB_NAME = 'DukaanDigitalDB';
    const DB_VERSION = 1;

    async function initDatabase() {
      return await idb.openDB(DB_NAME, DB_VERSION, {
        upgrade(db) {
          if (!db.objectStoreNames.contains('products')) {
            db.createObjectStore('products', { keyPath: 'id' });
          }
          if (!db.objectStoreNames.contains('bills')) {
            const billStore = db.createObjectStore('bills', { keyPath: 'id' });
            billStore.createIndex('date', 'date');
            billStore.createIndex('customerPhone', 'customerPhone');
          }
          if (!db.objectStoreNames.contains('khata')) {
            const khataStore = db.createObjectStore('khata', { keyPath: 'id' });
            khataStore.createIndex('customerPhone', 'customerPhone');
            khataStore.createIndex('date', 'date');
          }
        }
      });
    }

    const DEMO_PRODUCTS = [
      { id: 1, name: "Grace Fabrics Royal Wash & Wear (Navy)", category: "Wash & Wear", price: 3800, stock: 18, image: null },
      { id: 2, name: "Pasha Egyptian Latha 100% Cotton (White)", category: "Cotton", price: 4500, stock: 14, image: null },
      { id: 3, name: "Kohinoor Jacquard Men's Kurta (Olive)", category: "Kurta", price: 3200, stock: 8, image: null },
      { id: 4, name: "Bareeze Luxury Embroidered Lawn 3-Pc", category: "Ladies", price: 6500, stock: 12, image: null },
      { id: 5, name: "Dynasty Executive Wash & Wear (Grey)", category: "Wash & Wear", price: 3600, stock: 4, image: null },
      { id: 6, name: "Gul Ahmed Soft Boski Cotton (Cream)", category: "Cotton", price: 4200, stock: 3, image: null }
    ];

    const DEMO_BILLS = [
      {
        id: 1001,
        billNo: 'DDK-1001',
        date: new Date(Date.now() - 86400000 * 2).toISOString().slice(0, 10),
        time: '03:30 PM',
        customerName: 'Muhammad Rizwan',
        customerPhone: '03017654321',
        items: [{ id: 1, name: 'Grace Fabrics Royal Wash & Wear (Navy)', price: 3800, qty: 2 }],
        subtotal: 7600,
        discount: 200,
        grandTotal: 7400,
        paidAmount: 5000,
        udhaarAmount: 2400,
        receiptType: 'thermal'
      },
      {
        id: 1002,
        billNo: 'DDK-1002',
        date: new Date(Date.now() - 86400000).toISOString().slice(0, 10),
        time: '06:15 PM',
        customerName: 'Chaudhry Bilal',
        customerPhone: '03219876543',
        items: [{ id: 2, name: 'Pasha Egyptian Latha 100% Cotton (White)', price: 4500, qty: 1 }],
        subtotal: 4500,
        discount: 0,
        grandTotal: 4500,
        paidAmount: 4500,
        udhaarAmount: 0,
        receiptType: 'a4'
      }
    ];

    const DEMO_KHATA = [
      {
        id: 1,
        customerPhone: '03017654321',
        customerName: 'Muhammad Rizwan',
        date: new Date(Date.now() - 86400000 * 2).toISOString().slice(0, 10),
        type: 'credit', // credit means udhaar added
        amount: 2400,
        billId: 1001,
        note: 'Bill #DDK-1001 Unpaid balance'
      }
    ];

    // --- Main App Component ---
    function App() {
      // LocalStorage Shop Settings
      const [lang, setLang] = useState(() => localStorage.getItem('ddk_lang') || 'ur');
      const [dark, setDark] = useState(() => localStorage.getItem('ddk_dark') === 'true');
      const [shop, setShop] = useState(() => {
        const saved = localStorage.getItem('ddk_shop');
        return saved ? JSON.parse(saved) : {
          name: "المدینہ فیبرکس اینڈ کلاٹھ ہاؤس",
          owner: "حاجی محمد طارق",
          phone: "03001234567",
          address: "دکان نمبر 24، مین کلاٹھ مارکیٹ، فیصل آباد",
          logo: null
        };
      });

      // PIN Lock State
      const [pinCode, setPinCode] = useState(() => localStorage.getItem('ddk_pin') || '');
      const [isLocked, setIsLocked] = useState(() => Boolean(localStorage.getItem('ddk_pin')));
      const [enteredPin, setEnteredPin] = useState('');
      const [pinError, setPinError] = useState('');
      const [showPinSetupModal, setShowPinSetupModal] = useState(false);
      const [newPinInput, setNewPinInput] = useState('');

      // Navigation & Online State
      const [tab, setTab] = useState('products'); // 'products' | 'billing' | 'sales' | 'khata' | 'dashboard' | 'settings'
      const [isOnline, setIsOnline] = useState(navigator.onLine);
      const [installPrompt, setInstallPrompt] = useState(null);

      // IndexedDB Data State
      const [dbReady, setDbReady] = useState(false);
      const [products, setProducts] = useState([]);
      const [bills, setBills] = useState([]);
      const [khataEntries, setKhataEntries] = useState([]);

      // Product Management
      const [search, setSearch] = useState('');
      const [category, setCategory] = useState('All');
      const [lowStockFilter, setLowStockFilter] = useState(false);
      const [modalProduct, setModalProduct] = useState(null);
      const [showProductModal, setShowProductModal] = useState(false);

      // Billing State
      const [billItems, setBillItems] = useState([]);
      const [customerName, setCustomerName] = useState('');
      const [customerPhone, setCustomerPhone] = useState('');
      const [discount, setDiscount] = useState(0);
      const [paidAmountInput, setPaidAmountInput] = useState('');
      const [receiptType, setReceiptType] = useState('thermal'); // 'thermal' (80mm) | 'a4'
      const [activePrintBill, setActivePrintBill] = useState(null);

      // Khata & Payment Modal
      const [khataSearch, setKhataSearch] = useState('');
      const [paymentModalCustomer, setPaymentModalCustomer] = useState(null);
      const [paymentAmount, setPaymentAmount] = useState('');
      const [paymentNote, setPaymentNote] = useState('');
      const [viewLedgerCustomer, setViewLedgerCustomer] = useState(null);

      // Sales Search
      const [salesSearch, setSalesSearch] = useState('');

      const isUrdu = lang === 'ur';

      // --- PWA Offline & Install Handlers ---
      useEffect(() => {
        const handleOnline = () => setIsOnline(true);
        const handleOffline = () => setIsOnline(false);
        window.addEventListener('online', handleOnline);
        window.addEventListener('offline', handleOffline);

        const handleBeforeInstall = (e) => {
          e.preventDefault();
          setInstallPrompt(e);
        };
        window.addEventListener('beforeinstallprompt', handleBeforeInstall);

        return () => {
          window.removeEventListener('online', handleOnline);
          window.removeEventListener('offline', handleOffline);
          window.removeEventListener('beforeinstallprompt', handleBeforeInstall);
        };
      }, []);

      // --- Shop Settings Persistence in localStorage ---
      useEffect(() => {
        localStorage.setItem('ddk_shop', JSON.stringify(shop));
      }, [shop]);

      useEffect(() => {
        localStorage.setItem('ddk_lang', lang);
      }, [lang]);

      useEffect(() => {
        localStorage.setItem('ddk_dark', dark);
        if (dark) document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
      }, [dark]);

      // --- Initialize IndexedDB and migrate / seed data ---
      useEffect(() => {
        async function loadDb() {
          try {
            const db = await initDatabase();
            // Check products
            let prods = await db.getAll('products');
            if (!prods || prods.length === 0) {
              // Check if legacy products exist in localStorage
              const legacy = localStorage.getItem('ddk_products');
              const seedData = legacy ? JSON.parse(legacy) : DEMO_PRODUCTS;
              const tx = db.transaction('products', 'readwrite');
              for (const p of seedData) {
                await tx.store.put(p);
              }
              await tx.done;
              localStorage.removeItem('ddk_products'); // Clean up
              prods = seedData;
            }
            setProducts(prods);

            // Check bills
            let billList = await db.getAll('bills');
            if (!billList || billList.length === 0) {
              const tx = db.transaction('bills', 'readwrite');
              for (const b of DEMO_BILLS) {
                await tx.store.put(b);
              }
              await tx.done;
              billList = DEMO_BILLS;
            }
            // Sort bills descending by date/id
            billList.sort((a, b) => b.id - a.id);
            setBills(billList);

            // Check khata
            let khataList = await db.getAll('khata');
            if (!khataList || khataList.length === 0) {
              const tx = db.transaction('khata', 'readwrite');
              for (const k of DEMO_KHATA) {
                await tx.store.put(k);
              }
              await tx.done;
              khataList = DEMO_KHATA;
            }
            setKhataEntries(khataList);
            setDbReady(true);
          } catch (err) {
            console.error('IndexedDB load failure', err);
            setProducts(DEMO_PRODUCTS);
            setBills(DEMO_BILLS);
            setKhataEntries(DEMO_KHATA);
            setDbReady(true);
          }
        }
        loadDb();
      }, []);

      // --- PIN Unlock Logic ---
      const handlePinPress = (digit) => {
        if (enteredPin.length < 4) {
          const next = enteredPin + digit;
          setEnteredPin(next);
          setPinError('');
          if (next.length === 4) {
            if (next === pinCode) {
              setIsLocked(false);
              setEnteredPin('');
            } else {
              setPinError(isUrdu ? 'غلط پن کوڈ! دوبارہ کوشش کریں' : 'Incorrect PIN! Try again');
              if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
              setTimeout(() => {
                setEnteredPin('');
              }, 600);
            }
          }
        }
      };

      const handlePinBackspace = () => {
        setEnteredPin(prev => prev.slice(0, -1));
        setPinError('');
      };

      // --- Filtered Products ---
      const filteredProducts = useMemo(() => {
        return products.filter(p => {
          const matchQ = !search || p.name.toLowerCase().includes(search.toLowerCase()) || p.category.toLowerCase().includes(search.toLowerCase());
          const matchC = category === 'All' || p.category === category;
          const matchL = !lowStockFilter || p.stock < 5;
          return matchQ && matchC && matchL;
        });
      }, [products, search, category, lowStockFilter]);

      const lowStockCount = useMemo(() => products.filter(p => p.stock < 5).length, [products]);

      // --- WhatsApp Link Generator ---
      const getWhatsAppLink = (product) => {
        const msg = isUrdu 
          ? `السلام علیکم، مجھے کپڑا "${product.name}" درکار ہے، قیمت ${product.price} روپے۔`
          : `Salam, I want ${product.name} Price ${product.price} PKR`;
        const cleanPhone = (shop.phone || '').replace(/[^0-9]/g, '');
        const intlPhone = cleanPhone.startsWith('03') ? '92' + cleanPhone.slice(1) : cleanPhone;
        return `https://wa.me/${intlPhone}?text=${encodeURIComponent(msg)}`;
      };

      // --- Bill Calculations ---
      const subtotal = useMemo(() => billItems.reduce((acc, it) => acc + (it.price * it.qty), 0), [billItems]);
      const grandTotal = Math.max(0, subtotal - (Number(discount) || 0));
      const actualPaid = paidAmountInput === '' ? grandTotal : Math.min(grandTotal, Math.max(0, Number(paidAmountInput) || 0));
      const udhaarBalance = Math.max(0, grandTotal - actualPaid);

      const addToBill = (prod) => {
        setBillItems(prev => {
          const idx = prev.findIndex(x => x.id === prod.id);
          if (idx >= 0) {
            const next = [...prev];
            next[idx] = { ...next[idx], qty: next[idx].qty + 1 };
            return next;
          }
          return [...prev, { id: prod.id, name: prod.name, price: prod.price, category: prod.category, qty: 1 }];
        });
      };

      // --- Save Bill & Record Khata in IndexedDB ---
      const handleSaveAndPrintBill = async () => {
        if (billItems.length === 0) return;

        // Mandatory validation: Customer phone is required for Udhaar (credit) transactions
        if (udhaarBalance > 0) {
          const rawDigits = (customerPhone || '').replace(/[^0-9]/g, '');
          if (!rawDigits || rawDigits.length < 10) {
            alert(isUrdu 
              ? "ادھار (کھاتہ) بل محفوظ کرنے کے لیے گاہک کا درست موبائل فون نمبر (مثلاً 03001234567) درج کرنا لازمی ہے!" 
              : "A valid customer phone number (e.g. 03001234567) is strictly required for Udhaar (Credit) bills!");
            return;
          }
        }

        const db = await initDatabase();
        const billId = Date.now();
        const newBill = {
          id: billId,
          billNo: `DDK-${billId.toString().slice(-4)}`,
          date: new Date().toISOString().slice(0, 10),
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          customerName: customerName.trim() || (isUrdu ? 'عام گاہک' : 'Walk-in Customer'),
          customerPhone: customerPhone.trim() || '---',
          items: billItems,
          subtotal,
          discount: Number(discount) || 0,
          grandTotal,
          paidAmount: actualPaid,
          udhaarAmount: udhaarBalance,
          receiptType
        };

        // Save bill to IndexedDB
        await db.put('bills', newBill);
        setBills(prev => [newBill, ...prev]);

        // If there is udhaar, save directly to Khata under customer's verified phone
        if (udhaarBalance > 0) {
          const khataEntry = {
            id: Date.now() + 1,
            customerPhone: customerPhone.trim(),
            customerName: customerName.trim() || (isUrdu ? 'ادھار گاہک' : 'Credit Customer'),
            date: new Date().toISOString().slice(0, 10),
            type: 'credit',
            amount: udhaarBalance,
            billId: newBill.id,
            note: `${isUrdu ? 'بل نمبر' : 'Bill'} #${newBill.billNo} ${isUrdu ? 'بقایا ادھار' : 'Udhaar'}`
          };
          await db.put('khata', khataEntry);
          setKhataEntries(prev => [...prev, khataEntry]);
        }

        // Deduct inventory stock in IndexedDB
        const updatedProducts = [...products];
        const tx = db.transaction('products', 'readwrite');
        for (const item of billItems) {
          const pIndex = updatedProducts.findIndex(p => p.id === item.id);
          if (pIndex >= 0) {
            const updatedStock = Math.max(0, updatedProducts[pIndex].stock - item.qty);
            updatedProducts[pIndex] = { ...updatedProducts[pIndex], stock: updatedStock };
            await tx.store.put(updatedProducts[pIndex]);
          }
        }
        await tx.done;
        setProducts(updatedProducts);

        // Open print view
        setActivePrintBill(newBill);
        setTimeout(() => {
          window.print();
        }, 150);

        // Reset billing inputs
        setBillItems([]);
        setCustomerName('');
        setCustomerPhone('');
        setDiscount(0);
        setPaidAmountInput('');
      };

      // --- Customers Khata Aggregation ---
      const customerKhataSummary = useMemo(() => {
        const map = {};
        // Group transactions by customerPhone
        khataEntries.forEach(entry => {
          const phone = (entry.customerPhone || '03000000000').trim();
          if (!map[phone]) {
            map[phone] = {
              phone,
              name: entry.customerName || (isUrdu ? 'گاہک' : 'Customer'),
              totalPurchases: 0,
              totalPaid: 0,
              udhaarBalance: 0,
              transactions: []
            };
          }
          map[phone].transactions.push(entry);
          if (entry.type === 'credit') {
            map[phone].udhaarBalance += entry.amount;
            map[phone].totalPurchases += entry.amount;
          } else if (entry.type === 'payment') {
            map[phone].udhaarBalance -= entry.amount;
            map[phone].totalPaid += entry.amount;
          }
        });

        // Also aggregate bills
        bills.forEach(bill => {
          const phone = (bill.customerPhone || '').trim();
          if (phone && phone !== '---') {
            if (!map[phone]) {
              map[phone] = {
                phone,
                name: bill.customerName,
                totalPurchases: bill.grandTotal,
                totalPaid: bill.paidAmount,
                udhaarBalance: bill.udhaarAmount,
                transactions: []
              };
            }
          }
        });

        const list = Object.values(map);
        if (!khataSearch) return list;
        const q = khataSearch.toLowerCase();
        return list.filter(c => c.name.toLowerCase().includes(q) || c.phone.includes(q));
      }, [khataEntries, bills, khataSearch, isUrdu]);

      const totalPendingUdhaar = useMemo(() => {
        return customerKhataSummary.reduce((sum, c) => sum + Math.max(0, c.udhaarBalance), 0);
      }, [customerKhataSummary]);

      // --- Record Khata Payment (Pay Wasooli) ---
      const handleRecordPayment = async (e) => {
        e.preventDefault();
        const amt = Number(paymentAmount);
        if (!amt || amt <= 0 || !paymentModalCustomer) return;

        const db = await initDatabase();
        const entry = {
          id: Date.now(),
          customerPhone: paymentModalCustomer.phone,
          customerName: paymentModalCustomer.name,
          date: new Date().toISOString().slice(0, 10),
          type: 'payment',
          amount: amt,
          note: paymentNote.trim() || (isUrdu ? 'نقد وصولی' : 'Cash Received')
        };

        await db.put('khata', entry);
        setKhataEntries(prev => [...prev, entry]);
        setPaymentModalCustomer(null);
        setPaymentAmount('');
        setPaymentNote('');
      };

      // --- Data Manager: Export Backup JSON ---
      const handleExportBackup = async () => {
        const db = await initDatabase();
        const allProducts = await db.getAll('products');
        const allBills = await db.getAll('bills');
        const allKhata = await db.getAll('khata');

        const backupData = {
          version: '2.0',
          appName: 'Dukaan Digital Kit',
          exportDate: new Date().toISOString(),
          shop,
          pin: pinCode,
          products: allProducts,
          bills: allBills,
          khata: allKhata
        };

        const blob = new Blob([JSON.stringify(backupData, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `dukaan_backup_${new Date().toISOString().slice(0, 10)}.json`;
        a.click();
        URL.revokeObjectURL(url);
      };

      // --- Data Manager: Import Backup JSON ---
      const handleImportBackup = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = async (event) => {
          try {
            const data = JSON.parse(event.target.result);
            if (!data.products && !data.bills) {
              alert(isUrdu ? 'غلط بیک اپ فائل!' : 'Invalid backup JSON file format');
              return;
            }

            const confirmMsg = isUrdu 
              ? `کیا آپ یہ بیک اپ بحال کرنا چاہتے ہیں؟ (${data.products?.length || 0} پراڈکٹس، ${data.bills?.length || 0} بلز)` 
              : `Restore backup? (${data.products?.length || 0} products, ${data.bills?.length || 0} bills)`;

            if (window.confirm(confirmMsg)) {
              const db = await initDatabase();
              
              if (data.products && data.products.length > 0) {
                const txP = db.transaction('products', 'readwrite');
                await txP.store.clear();
                for (const p of data.products) await txP.store.put(p);
                await txP.done;

          `"${p.category}"`,
          p.price,
          p.stock,
          p.price * p.stock

        const csvContent = "\uFEFF" + [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `dukaan_products_${new Date().toISOString().slice(0, 10)}.csv`;

                receiptType
              };

              const isThermal = (activePrintBill ? activePrintBill.receiptType : receiptType) === 'thermal';

              if (isThermal) {
                return (
                  <div className="text-black text-center font-mono text-[11px] leading-tight space-y-1" dir={isUrdu ? 'rtl' : 'ltr'}>
                    <p className="font-bold text-base">{shop.name}</p>
                    <p className="text-[10px]">{shop.owner} • 📞 {shop.phone}</p>
                    <p className="text-[9px]">{shop.address}</p>
                    <p>--------------------------------</p>
                    <div className="flex justify-between text-[10px] text-left rtl:text-right">
                      <span>{isUrdu ? `بل نمبر: ${b.billNo}` : `Bill: ${b.billNo}`}</span>
                      <span>{b.date} {b.time}</span>
                    </div>
                    <div className="text-left rtl:text-right text-[10px]">
                      <span>{isUrdu ? "گاہک" : "Cust"}: {b.customerName} {b.customerPhone && b.customerPhone !== '---' ? `(${b.customerPhone})` : ''}</span>
                    </div>
                    <p>================================</p>
                    <div className="text-left rtl:text-right space-y-1">
                      {b.items.map((item, idx) => (
                        <div key={idx}>
                          <p className="font-bold">{item.name}</p>
                          <div className="flex justify-between text-[10px]">
                            <span>{item.qty} x Rs.{item.price}</span>
                            <span>Rs.{item.qty * item.price}</span>
                          </div>
                        </div>
                      ))}
                    </div>
                    <p>--------------------------------</p>
                    <div className="text-[11px] space-y-0.5">
                      <div className="flex justify-between">
                        <span>{isUrdu ? "سب ٹوٹل (Subtotal):" : "Subtotal:"}</span>
                        <span>Rs.{b.subtotal}</span>
                      </div>
                      {b.discount > 0 && (
                        <div className="flex justify-between">
                          <span>{isUrdu ? "رعایت (Discount):" : "Discount:"}</span>
                          <span>-Rs.{b.discount}</span>
                        </div>
                      )}
                      <div className="flex justify-between font-bold text-sm border-t border-dashed pt-1">
                        <span>{isUrdu ? "حتمی ٹوٹل (TOTAL):" : "TOTAL:"}</span>
                        <span>Rs.{b.grandTotal}</span>
                      </div>
                      <div className="flex justify-between">
                        <span>{isUrdu ? "وصول نقد (Cash Paid):" : "Paid Cash:"}</span>
                        <span>Rs.{b.paidAmount}</span>
                      </div>
                      {b.udhaarAmount > 0 && (
                        <div className="flex justify-between font-bold text-red-600">
                          <span>{isUrdu ? "بقایا ادھار (Udhaar):" : "Balance Udhaar:"}</span>
                          <span>Rs.{b.udhaarAmount}</span>
                        </div>
                      )}
                    </div>
                    <p>================================</p>
                    <p className="text-[10px] pt-1 font-semibold">{isUrdu ? "شکریہ! خریدا ہوا مال واپس یا تبدیل نہیں ہوگا" : "Thank you! Goods once sold will not be returned"}</p>
                    <p className="text-[9px] text-gray-600">Software by Dukaan Digital Kit (دکان ڈیجیٹل کٹ)</p>
                  </div>
                );
              }

              // A4 Standard Layout
              return (
                <div className="text-black space-y-4 p-4 border border-black rounded-lg" dir={isUrdu ? 'rtl' : 'ltr'}>
                  <div className="flex justify-between items-center border-b pb-4">
                    <div>
                      <h1 className="text-2xl font-bold text-emerald-950">{shop.name}</h1>
                      <p className="text-sm">{shop.owner} • 📞 {shop.phone}</p>
                      <p className="text-xs text-gray-600">{shop.address}</p>
                    </div>
                    <div className="text-right rtl:text-left">
                      <h2 className="text-xl font-bold uppercase tracking-wide">{isUrdu ? "سیلز انوائس / رسید" : "SALES INVOICE"}</h2>
                      <p className="text-sm font-semibold">{b.billNo}</p>
                      <p className="text-xs text-gray-600">{isUrdu ? "تاریخ" : "Date"}: {b.date} {b.time}</p>
                    </div>
                  </div>

                  <div className="bg-gray-50 p-3 rounded text-sm">
                    <p><strong>{isUrdu ? "گاہک کا نام (Customer):" : "Customer Name:"}</strong> {b.customerName}</p>
                    {b.customerPhone && b.customerPhone !== '---' && <p><strong>{isUrdu ? "موبائل فون (Phone):" : "Phone:"}</strong> {b.customerPhone}</p>}
                  </div>

                  <table className="w-full text-sm border-collapse border border-gray-300">
                    <thead>
                      <tr className="bg-gray-100">
                        <th className="border border-gray-300 p-2 text-left rtl:text-right">#</th>
                        <th className="border border-gray-300 p-2 text-left rtl:text-right">{isUrdu ? "تفصیل کپڑا / Item Description" : "Item Description"}</th>
                        <th className="border border-gray-300 p-2 text-right rtl:text-left">{isUrdu ? "تعداد / Qty" : "Qty"}</th>
                        <th className="border border-gray-300 p-2 text-right rtl:text-left">{isUrdu ? "قیمت / Unit Price" : "Unit Price"}</th>
                        <th className="border border-gray-300 p-2 text-right rtl:text-left">{isUrdu ? "ٹوٹل / Total" : "Total"}</th>
                      </tr>
                    </thead>
                    <tbody>
                      {b.items.map((it, idx) => (
                        <tr key={idx}>
                          <td className="border border-gray-300 p-2">{idx + 1}</td>
                          <td className="border border-gray-300 p-2 font-medium">{it.name}</td>
                          <td className="border border-gray-300 p-2 text-right rtl:text-left">{it.qty}</td>
                          <td className="border border-gray-300 p-2 text-right rtl:text-left">Rs. {it.price}</td>
                          <td className="border border-gray-300 p-2 text-right rtl:text-left font-semibold">Rs. {it.qty * it.price}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>

                  <div className="flex justify-end rtl:justify-start">
                    <div className="w-64 space-y-1 text-sm">
                      <div className="flex justify-between">
                        <span>{isUrdu ? "سب ٹوٹل (Subtotal):" : "Subtotal:"}</span>
                        <span>Rs. {b.subtotal}</span>
                      </div>
                      {b.discount > 0 && (
                        <div className="flex justify-between text-red-600">
                          <span>{isUrdu ? "رعایت (Discount):" : "Discount:"}</span>
                          <span>-Rs. {b.discount}</span>
                        </div>
                      )}
                      <div className="flex justify-between font-bold text-base border-t pt-1">
                        <span>{isUrdu ? "حتمی رقم (Grand Total):" : "Grand Total:"}</span>
                        <span>Rs. {b.grandTotal} PKR</span>
                      </div>
                      <div className="flex justify-between">
                        <span>{isUrdu ? "نقد ادا شدہ (Paid):" : "Paid Amount:"}</span>
                        <span>Rs. {b.paidAmount}</span>
                      </div>
                      {b.udhaarAmount > 0 && (
                        <div className="flex justify-between font-bold text-red-600">
                          <span>{isUrdu ? "بقایا ادھار (Udhaar):" : "Udhaar Balance:"}</span>
                          <span>Rs. {b.udhaarAmount}</span>
                        </div>
                      )}
                    </div>
                  </div>

                  <div className="pt-8 border-t flex justify-between text-xs text-gray-500">
                    <div>
                      <p>{isUrdu ? "دستخط گاہک: __________________" : "Customer Signature: __________________"}</p>
                    </div>
                    <div className="text-right rtl:text-left">
                      <p>{isUrdu ? "دستخط دکاندار: __________________" : "Authorized Signature: __________________"}</p>
                      <p className="mt-1 font-semibold">{isUrdu ? "خریدا ہوا مال واپس یا تبدیل نہیں ہوگا • شکریہ!" : "Goods once sold will not be returned • Thank you for your business!"}</p>
                    </div>
                  </div>
                </div>
              );
            })()}
          </div>

          {/* Bottom Mobile Navigation Bar */}
          <nav className="fixed bottom-0 left-0 right-0 z-40 bg-white/95 dark:bg-zinc-900/95 backdrop-blur border-t border-gray-200 dark:border-zinc-800 shadow-lg">
            <div className="max-w-4xl mx-auto flex justify-around items-center">
              <button
                onClick={() => setTab('products')}
                className={`flex flex-col items-center py-2 px-2.5 text-[11px] font-semibold transition-colors ${
                  tab === 'products' ? 'text-emerald-900 dark:text-emerald-400 font-bold' : 'text-gray-400'
                }`}
              >
                <span className="text-lg">🧵</span>
                <span>{isUrdu ? "پراڈکٹس" : "Fabrics"}</span>
              </button>

              <button
                onClick={() => setTab('billing')}
                className={`relative flex flex-col items-center py-2 px-2.5 text-[11px] font-semibold transition-colors ${
                  tab === 'billing' ? 'text-emerald-900 dark:text-emerald-400 font-bold' : 'text-gray-400'
                }`}
              >
                <span className="text-lg">🧾</span>
                <span>{isUrdu ? "بل جنریٹر" : "Billing"}</span>
                {billItems.length > 0 && (
                  <span className="absolute top-1 right-1.5 bg-emerald-700 text-white text-[10px] w-4 h-4 rounded-full flex items-center justify-center font-bold">
                    {billItems.length}
                  </span>
                )}
              </button>

              <button
                onClick={() => setTab('sales')}
                className={`flex flex-col items-center py-2 px-2.5 text-[11px] font-semibold transition-colors ${
                  tab === 'sales' ? 'text-emerald-900 dark:text-emerald-400 font-bold' : 'text-gray-400'
                }`}
              >
                <span className="text-lg">📜</span>
                <span>{isUrdu ? "سیلز ہسٹری" : "Sales"}</span>
              </button>

              <button
                onClick={() => setTab('khata')}
                className={`relative flex flex-col items-center py-2 px-2.5 text-[11px] font-semibold transition-colors ${
                  tab === 'khata' ? 'text-emerald-900 dark:text-emerald-400 font-bold' : 'text-gray-400'
                }`}
              >
                <span className="text-lg">📒</span>
                <span>{isUrdu ? "کھاتہ" : "Khata"}</span>
                {totalPendingUdhaar > 0 && (
                  <span className="absolute top-1.5 right-1.5 w-2 h-2 bg-red-500 rounded-full" />
                )}
              </button>

              <button
                onClick={() => setTab('dashboard')}
                className={`flex flex-col items-center py-2 px-2.5 text-[11px] font-semibold transition-colors ${
                  tab === 'dashboard' ? 'text-emerald-900 dark:text-emerald-400 font-bold' : 'text-gray-400'
                }`}
              >
                <span className="text-lg">📊</span>
                <span>{isUrdu ? "ڈیش بورڈ" : "Stats"}</span>
              </button>

              <button
                onClick={() => setTab('settings')}
                className={`flex flex-col items-center py-2 px-2.5 text-[11px] font-semibold transition-colors ${
                  tab === 'settings' ? 'text-emerald-900 dark:text-emerald-400 font-bold' : 'text-gray-400'
                }`}
              >
                <span className="text-lg">⚙️</span>
                <span>{isUrdu ? "سیٹنگز" : "Settings"}</span>
              </button>
            </div>
          </nav>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
